name: Vendor Keeper image (one-time)
on:
  push:
    branches:
      - feat/keeper-asset-first-redesign
    paths:
      - .github/workflows/vendor-keeper-image.yml
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Vendor approved 8-frame YOU game sprite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p modes/dungeon/assets
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            "https://cdn.shopify.com/s/files/1/0279/0647/4062/files/rizo-dungeon-you-keeper-atlas-480x360.webp?v=1791675635" \
            -o modes/dungeon/assets/keeper-sprite-atlas.webp
          file modes/dungeon/assets/keeper-sprite-atlas.webp
          sha256sum modes/dungeon/assets/keeper-sprite-atlas.webp
          python3 - <<'PY'
          from pathlib import Path
          image = Path("modes/dungeon/assets/keeper-sprite-atlas.webp").read_bytes()
          assert 10000 < len(image) < 500000, "unexpected asset size"
          assert image[:4] == b"RIFF" and image[8:12] == b"WEBP", "not a WebP image"
          print(f"Vendoring {len(image):,} bytes with valid WebP header")
          PY
      - name: Preserve binary artwork in Git history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modes/dungeon/assets/keeper-sprite-atlas.webp
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Vendor original YOU sprite atlas locally for offline game runtime"
          git push origin HEAD:feat/keeper-asset-first-redesign
