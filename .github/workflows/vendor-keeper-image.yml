name: Vendor Keeper image (one-time)
on:
  push:
    branches:
      - feat/keeper-asset-first-redesign
    paths:
      - .github/workflows/vendor-keeper-image.yml
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Vendor approved 8-frame YOU game sprite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p modes/dungeon/assets
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            "https://cdn.shopify.com/s/files/1/0279/0647/4062/files/rizo-dungeon-you-keeper-atlas-480x360.webp?v=1791675635" \
            -o modes/dungeon/assets/keeper-sprite-atlas.png
          file modes/dungeon/assets/keeper-sprite-atlas.png
          echo "c0d09bd5f28226f49d4cb72f2475dbfa8b997f692d50f688b229104817fda5ae  modes/dungeon/assets/keeper-sprite-atlas.png" | sha256sum -c -

      - name: Preserve binary artwork in Git history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modes/dungeon/assets/keeper-sprite-atlas.png
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Vendor original YOU sprite atlas locally for offline game runtime"
          git push origin HEAD:feat/keeper-asset-first-redesign
