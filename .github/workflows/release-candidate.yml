name: Rizo World release candidate

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Current release suites
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check source syntax and whitespace
        shell: bash
        run: |
          git diff --check HEAD
          for file in game-v79-defense.js rizo-config.js install-manager.js monetization.js sw.js core/*.js providers/*.js training/*.js modes/defense/*.js modes/dungeon/*.js; do
            node --check "$file"
          done

      - name: Run all current Node suites
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rizo-qa"
          status=0
          for suite in tests/*.test.js; do
            if ! node "$suite" 2>&1 | tee "$RUNNER_TEMP/rizo-qa/$(basename "$suite").log"; then
              status=1
            fi
          done
          exit "$status"

      - name: Build the production artifact
        run: python tools/build-site.py --out dist

      - name: Install development-only browser tools
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium

      - name: Run the documented browser release suites
        shell: bash
        run: |
          status=0
          for suite in browser-home-world browser-home-alive browser-dungeon browser-dungeon-controls browser-dungeon-cohesion browser-dungeon-depth save-safety browser-defense-integration mode-contract training-contract browser-launch-recovery browser-v88-training-fixes browser-v88-authored browser-v87-arcade-freeze; do
            extra_args=()
            if [[ "$suite" == browser-dungeon-cohesion ]]; then
              extra_args=(--evidence "$RUNNER_TEMP/rizo-qa/dungeon-cohesion")
            fi
            if [[ "$suite" == browser-dungeon-depth ]]; then
              extra_args=(--evidence "$RUNNER_TEMP/rizo-qa/dungeon-depth")
            fi
            if ! python "tests/$suite.py" "${extra_args[@]}" 2>&1 | tee "$RUNNER_TEMP/rizo-qa/$suite.log"; then
              status=1
            fi
          done
          if ! python tests/browser-public-product.py --directory dist --evidence "$RUNNER_TEMP/rizo-public-review" 2>&1 | tee "$RUNNER_TEMP/rizo-qa/browser-public-product.log"; then
            status=1
          fi
          if ! python tests/browser-world-first.py --directory dist 2>&1 | tee "$RUNNER_TEMP/rizo-qa/browser-world-first.log"; then
            status=1
          fi
          exit "$status"

      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rizo-qa-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rizo-qa
            ${{ runner.temp }}/rizo-public-review
          retention-days: 7
          if-no-files-found: warn

      - name: Keep the verified static artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rizo-world-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
