name: Dungeon stacked-PR quality gate

on:
  push:
    branches: ["feat/dungeon-*"]
    paths:
      - "modes/dungeon/**"
      - "tests/dungeon-*.test.js"
      - "tests/browser-dungeon*.py"
      - "tests/capture-dungeon-*.py"
      - ".github/workflows/dungeon-stacked-qa.yml"
  pull_request:
    branches: ["feat/dungeon-*"]
    paths:
      - "modes/dungeon/**"
      - "tests/dungeon-*.test.js"
      - "tests/browser-dungeon*.py"
      - "tests/capture-dungeon-*.py"
      - ".github/workflows/dungeon-stacked-qa.yml"

permissions:
  contents: read

concurrency:
  group: dungeon-stacked-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Dungeon browser and character continuity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Parse Dungeon JavaScript and run all Node tests
        shell: bash
        run: |
          for file in modes/dungeon/*.js; do node --check "$file"; done
          mkdir -p "$RUNNER_TEMP/dungeon-qa"
          status=0
          for suite in tests/*.test.js; do
            if ! node "$suite" > "$RUNNER_TEMP/dungeon-qa/$(basename "$suite").log" 2>&1; then
              cat "$RUNNER_TEMP/dungeon-qa/$(basename "$suite").log"
              status=1
            fi
          done
          exit "$status"

      - name: Build real production website
        run: python tools/build-site.py --out dist

      - name: Install Chromium for browser tests
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium

      - name: Run player-critical Dungeon browser suites
        shell: bash
        run: |
          set +e
          status=0
          for suite in browser-dungeon browser-dungeon-controls browser-dungeon-cohesion browser-dungeon-depth browser-dungeon-gamefeel browser-dungeon-escape browser-dungeon-reading browser-dungeon-character-lab; do
            extra_args=()
            case "$suite" in
              browser-dungeon-cohesion|browser-dungeon-depth|browser-dungeon-gamefeel|browser-dungeon-escape|browser-dungeon-character-lab)
                extra_args=(--evidence "$RUNNER_TEMP/dungeon-qa/$suite")
                ;;
            esac
            python "tests/$suite.py" "${extra_args[@]}" > "$RUNNER_TEMP/dungeon-qa/$suite.log" 2>&1
            result=$?
            tail -n 12 "$RUNNER_TEMP/dungeon-qa/$suite.log"
            if [[ $result -ne 0 ]]; then echo "FAILED: $suite"; status=1; fi
          done
          exit "$status"

      - name: Capture real 320px and 390px characters and opening
        if: always()
        shell: bash
        run: |
          if [[ -d dist ]]; then
            python tests/capture-dungeon-character-art.py --directory dist --evidence "$RUNNER_TEMP/dungeon-qa/live-character-captures"
            python tests/capture-dungeon-opening-direction.py --directory dist --evidence "$RUNNER_TEMP/dungeon-qa/live-opening-captures"
          else
            echo "No dist directory; production build failed"
            exit 1
          fi

      - name: Keep logs and phone-size scene evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dungeon-stacked-qa-${{ github.sha }}
          path: ${{ runner.temp }}/dungeon-qa
          retention-days: 7
          if-no-files-found: warn
