name: Rizo Core

on:
  push:
  pull_request:
    paths:
      - "src/rizo-core/**"
      - "src/rizo-world/**"
      - "src/content/**"
      - "tests/rizo-core-v1.mjs"
      - "tests/rizo-world-bridge.mjs"
      - "tests/rizo-world-static.mjs"
      - "tests/browser-rizo-world-organizer.py"
      - "game-v79-defense.js"
      - "index.html"
      - "rizo-config.js"
      - "sw.js"
      - ".github/workflows/rizo-core.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Rizo Core tests
        run: node --experimental-default-type=module tests/rizo-core-v1.mjs

      - name: Run Rizo World bridge tests
        run: node --experimental-default-type=module tests/rizo-world-bridge.mjs

      - name: Run Rizo World boot/offline tests
        run: node --experimental-default-type=module tests/rizo-world-static.mjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser smoke dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run portable Chromium integration smoke
        run: python tests/browser-rizo-world-organizer.py
