<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Dungeon kit greybox (dev)</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#0b0e14;color:#e9e4d8;font:14px/1.4 Inter,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
  main{width:min(100vw - 32px, 640px)}
  h1{font-size:15px;letter-spacing:.08em;margin:12px 0 4px}
  p{margin:4px 0 10px;color:#b8c9d4}
  canvas{width:100%;background:#000;border:2px solid #2c313d;border-radius:6px;image-rendering:pixelated}
  #hud{min-height:44px;margin-top:8px;padding:8px 10px;border-radius:4px;background:#141922}
  #hud b{color:#ffaf4a}
  .gate{padding:24px;border:1px dashed #5f7685;border-radius:6px}
</style>
</head>
<body>
<main>
  <h1>RIZO DUNGEON — LATE-GAME KIT (GREYBOX, DEV ONLY)</h1>
  <p>Cage → vents (three grate views) → factory floor (watchers, lockers) → the run out. Arrows/WASD move; Z rattles, Space flares. Not the live game; nothing is saved.</p>
  <div id="gate" class="gate" hidden>This page is a development tool. Open it with <code>?dev=1</code>.</div>
  <canvas id="kit" width="640" height="400" hidden></canvas>
  <div id="hud"></div>
</main>
<script src="../../modes/dungeon/dungeon-art.js"></script>
<script src="../../modes/dungeon/dungeon-content.js"></script>
<script src="../../modes/dungeon/dungeon-core.js"></script>

</body>
</html>
